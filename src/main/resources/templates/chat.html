<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat</title>


    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>


    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #080812;

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        /* =========================
           MAIN CHAT CONTAINER
        ========================= */

        .chat-container {

            width: 100%;

            max-width: 750px;

            background: #11111f;

            padding: 25px;

            border-radius: 18px;

            border: 1px solid #29243a;

            box-shadow:
                0 0 30px rgba(100, 40, 100, 0.25);
        }


        /* =========================
           TITLE
        ========================= */

        .chat-title {

            text-align: center;

            color: #ff4d6d;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 25px;
        }


        /* =========================
           CHAT BOX
        ========================= */

        #chat {

            width: 100%;

            height: 400px;

            overflow-y: auto;

            padding: 18px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #101a32,
                #1d1428,
                #28152c
            );

            border: 1px solid #3b304b;

            box-shadow:
                inset 0 0 25px rgba(80, 40, 100, 0.3);

            margin-bottom: 20px;

            display: flex;

            flex-direction: column;
        }


        /* =========================
           MESSAGE ROW
        ========================= */

        .message-row {

            width: 100%;

            display: flex;

            margin-bottom: 12px;
        }


        /* =========================
           LEFT MESSAGE
        ========================= */

        .message-row.left {

            justify-content: flex-start;
        }


        /* =========================
           RIGHT MESSAGE
        ========================= */

        .message-row.right {

            justify-content: flex-end;
        }


        /* =========================
           MESSAGE BUBBLE
        ========================= */

        .message {

            max-width: 65%;

            padding: 10px 15px;

            border-radius: 14px;

            font-size: 15px;

            line-height: 1.4;

            word-wrap: break-word;
        }


        /* =========================
           LEFT BUBBLE
        ========================= */

        .left .message {

            background: #202b45;

            color: #f1f1f5;

            border-bottom-left-radius: 3px;

            border-left: 3px solid #667eea;
        }


        /* =========================
           RIGHT BUBBLE
        ========================= */

        .right .message {

            background: #d93650;

            color: white;

            border-bottom-right-radius: 3px;
        }


        /* =========================
           SENDER NAME
        ========================= */

        .sender-name {

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 4px;

            color: #ff7189;
        }


        .right .sender-name {

            color: #ffd4db;
        }


        /* =========================
           INPUT LABEL
        ========================= */

        label {

            color: #c8c3d1;

            font-size: 14px;

            margin-bottom: 6px;
        }


        /* =========================
           INPUT BOX
        ========================= */

        .form-control {

            background: #171827;

            border: 1px solid #39354d;

            color: white;

            border-radius: 8px;

            padding: 11px 13px;
        }


        .form-control:focus {

            background: #171827;

            color: white;

            border-color: #ff4d6d;

            box-shadow:
                0 0 0 3px rgba(255, 77, 109, 0.12);
        }


        .form-control::placeholder {

            color: #777486;
        }


        /* =========================
           SEND BUTTON
        ========================= */

        #sendButton {

            background: #e63946;

            border: none;

            color: white;

            font-weight: bold;

            padding: 11px 28px;

            border-radius: 8px;

            min-width: 110px;

            transition: 0.2s;
        }


        #sendButton:hover {

            background: #ff4d5f;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(230, 57, 70, 0.25);
        }


        #sendButton:disabled {

            background: #6b2831;

            color: #aaa;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }


        /* =========================
           CONNECTION STATUS
        ========================= */

        #status {

            text-align: center;

            font-size: 13px;

            margin-top: 15px;

            color: #8d8998;
        }


        /* =========================
           SCROLLBAR
        ========================= */

        #chat::-webkit-scrollbar {

            width: 7px;
        }


        #chat::-webkit-scrollbar-track {

            background: #0d1020;

            border-radius: 10px;
        }


        #chat::-webkit-scrollbar-thumb {

            background: #4b3455;

            border-radius: 10px;
        }


        #chat::-webkit-scrollbar-thumb:hover {

            background: #ff4d6d;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 10px;
            }


            .chat-container {

                padding: 18px;
            }


            .chat-title {

                font-size: 25px;
            }


            #chat {

                height: 350px;
            }


            .message {

                max-width: 85%;
            }


            #sendButton {

                width: 100%;

                margin-top: 10px;
            }
        }

    </style>

</head>


<body>


<div class="chat-container">


    <!-- =========================
         TITLE
    ========================= -->

    <div class="chat-title">

        💬 Real-Time Chat

    </div>


    <!-- =========================
         CHAT AREA
    ========================= -->

    <div id="chat">

        <!-- Messages appear here -->

    </div>


    <!-- =========================
         YOUR NAME
    ========================= -->

    <div class="mb-3">

        <label for="sender">

            Your Name

        </label>


        <input
                type="text"
                id="sender"
                class="form-control"
                placeholder="Enter your name"
                autocomplete="off">

    </div>


    <!-- =========================
         MESSAGE
    ========================= -->

    <div class="mb-3">

        <label for="content">

            Message

        </label>


        <input
                type="text"
                id="content"
                class="form-control"
                placeholder="Type your message..."
                autocomplete="off">

    </div>


    <!-- =========================
         SEND BUTTON
    ========================= -->

    <div class="text-end">

        <button
                id="sendButton"
                type="button"
                onclick="sendMessage()"
                disabled>

            Send

        </button>

    </div>


    <!-- =========================
         STATUS
    ========================= -->

    <div id="status">

        Connecting...

    </div>


</div>



<script>

    /* =========================
       STOMP CLIENT
    ========================= */

    var stompClient = null;



    /* =========================
       CONNECT TO SPRING BOOT
    ========================= */

    function connect() {

        console.log("Trying to connect...");


        var socket = new SockJS('/chat');


        stompClient = Stomp.over(socket);


        /*
         Disable STOMP debug messages
        */
        stompClient.debug = null;


        stompClient.connect(

            {},

            function (frame) {

                console.log(
                    "Connected: " + frame
                );


                setConnected(true);


                /*
                 Subscribe to messages
                */

                stompClient.subscribe(

                    '/topic/messages',

                    function (message) {

                        console.log(
                            "Message received:",
                            message.body
                        );


                        showMessage(
                            JSON.parse(message.body)
                        );

                    }

                );

            },


            function (error) {

                console.error(
                    "WebSocket connection error:",
                    error
                );


                setConnected(false);

            }

        );

    }



    /* =========================
       CONNECTION STATUS
    ========================= */

    function setConnected(connected) {

        var button =
            document.getElementById(
                "sendButton"
            );


        var status =
            document.getElementById(
                "status"
            );


        if (connected) {

            button.disabled = false;


            status.innerText =
                "🟢 Connected";


            status.style.color =
                "#4ade80";

        }

        else {

            button.disabled = true;


            status.innerText =
                "🔴 Disconnected";


            status.style.color =
                "#ff4d6d";
        }

    }



    /* =========================
       SHOW MESSAGE

       1st → LEFT
       2nd → RIGHT
       3rd → LEFT
       4th → RIGHT
       ========================= */

    function showMessage(message) {

        var chat =
            document.getElementById(
                "chat"
            );


        /*
         Create message row
        */

        var row =
            document.createElement(
                "div"
            );


        /*
         Count current messages
        */

        var messageCount =
            chat.getElementsByClassName(
                "message-row"
            ).length;


        /*
         Alternate LEFT and RIGHT
        */

        if (messageCount % 2 === 0) {

            /*
             1st, 3rd, 5th...
             */

            row.className =
                "message-row left";

        }

        else {

            /*
             2nd, 4th, 6th...
             */

            row.className =
                "message-row right";
        }


        /*
         Create message bubble
        */

        var messageBox =
            document.createElement(
                "div"
            );


        messageBox.className =
            "message";


        /*
         Sender name
        */

        var senderName =
            document.createElement(
                "div"
            );


        senderName.className =
            "sender-name";


        senderName.textContent =
            message.sender;


        /*
         Message text
        */

        var messageText =
            document.createElement(
                "div"
            );


        messageText.textContent =
            message.content;


        /*
         Add sender name
        */

        messageBox.appendChild(
            senderName
        );


        /*
         Add message
        */

        messageBox.appendChild(
            messageText
        );


        /*
         Add bubble to row
        */

        row.appendChild(
            messageBox
        );


        /*
         Add row to chat
        */

        chat.appendChild(
            row
        );


        /*
         Automatically scroll
        */

        chat.scrollTop =
            chat.scrollHeight;

    }



    /* =========================
       SEND MESSAGE
    ========================= */

    function sendMessage() {

        var sender =
            document.getElementById(
                "sender"
            ).value.trim();


        var content =
            document.getElementById(
                "content"
            ).value.trim();


        /*
         Check empty fields
        */

        if (
            sender === "" ||
            content === ""
        ) {

            alert(
                "Please enter your name and message."
            );

            return;
        }


        /*
         Check WebSocket
        */

        if (
            stompClient === null ||
            !stompClient.connected
        ) {

            alert(
                "WebSocket is not connected."
            );

            return;
        }


        /*
         Create message object
        */

        var chatMessage = {

            sender: sender,

            content: content

        };


        console.log(
            "Sending:",
            chatMessage
        );


        /*
         Send to Spring Boot
        */

        stompClient.send(

            "/app/sendMessage",

            {},

            JSON.stringify(
                chatMessage
            )

        );


        /*
         Clear message input
        */

        document.getElementById(
            "content"
        ).value = "";


        /*
         Focus message box
        */

        document.getElementById(
            "content"
        ).focus();

    }



    /* =========================
       ENTER TO SEND
    ========================= */

    document
        .getElementById("content")
        .addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );



    /* =========================
       START CONNECTION
    ========================= */

    window.onload = function () {

        connect();

    };

</script>


</body>

</html>
